<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kiteracer v0.9</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&display=swap"
            rel="stylesheet"
        />
        <style>
            :root { --bg:#080808; --ui-bg:rgba(9,9,9,0.97); --border:#1c1c1c; --text:#f0f0ee; --accent:#363636 }
            body.light-mode { --bg:#f0f0ee; --ui-bg:rgba(242,242,240,0.98); --border:#d0d0ce; --text:#080808; --accent:#b4b4b2 }
            body,html { margin:0;padding:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Geist Mono',monospace;overflow:hidden;user-select:none;transition:background-color 0.5s ease;display:flex;align-items:center;justify-content:center }
            canvas { display:block;box-shadow:0 40px 100px rgba(0,0,0,0.8);background:#000 }
            /* ── Panel ── */
            #panel-trigger { position:fixed;left:0;top:0;width:20px;height:100vh;z-index:150 }
            #panel-trigger::after { content:'';position:absolute;left:0;top:15%;bottom:15%;width:1px;background:var(--text);opacity:0.05;transition:opacity 0.4s }
            #panel-trigger:hover::after { opacity:0.15 }
            #panel { position:fixed;left:0;top:0;width:252px;height:100vh;background:var(--ui-bg);border-right:1px solid var(--border);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);z-index:200;display:flex;flex-direction:column;transform:translateX(-100%);will-change:transform;overflow:hidden }
            #panel.open { transform:translateX(0) }
            .panel-hd { display:flex;align-items:center;justify-content:space-between;padding:18px 20px 17px;border-bottom:1px solid var(--border);flex-shrink:0 }
            .panel-logo { font-size:10px;font-weight:400;letter-spacing:0.22em;color:var(--text);opacity:0.4 }
            .pin-btn { background:none;border:none;color:var(--text);cursor:pointer;font-size:12px;line-height:1;opacity:0.52;padding:2px 0;transition:opacity 0.15s;font-family:inherit }
            .pin-btn:hover, .pin-btn.pinned { opacity:0.75 }
            .pin-btn:focus-visible { opacity:1;outline:1px solid var(--text);outline-offset:3px }
            .panel-body { flex:1;overflow-y:auto;padding:2px 0 }
            .panel-body::-webkit-scrollbar { width:2px }
            .panel-body::-webkit-scrollbar-thumb { background:var(--accent) }
            /* ── Sections ── */
            .panel-sec { padding:13px 20px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:9px }
            .panel-sec:last-child { border-bottom:none }
            .sec-label { font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text);opacity:0.57;padding-bottom:2px }
            .ctrl-row { display:flex;align-items:center;justify-content:space-between;gap:8px }
            .ctrl-label { font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text);opacity:0.57;white-space:nowrap;flex-shrink:0 }
            .ctrl-val { font-size:9px;color:var(--text);opacity:0.40;min-width:28px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0 }
            /* ── Controls ── */
            .import-btn { display:block;border:1px solid var(--border);padding:9px 0;cursor:pointer;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text);opacity:0.57;text-align:center;transition:opacity 0.15s,border-color 0.15s;font-family:'Geist Mono',monospace }
            .import-btn:hover { opacity:0.85;border-color:var(--accent) }
            #file-input { display:none }
            select { background:transparent;color:var(--text);border:none;border-bottom:1px solid var(--border);font-family:'Geist Mono',monospace;font-size:9px;letter-spacing:0.04em;padding:2px 0;max-width:128px;cursor:pointer;-webkit-appearance:none;opacity:0.60;text-align:right }
            select:hover { opacity:1;border-bottom-color:var(--accent) }
            select:focus-visible { opacity:1;outline:1px solid var(--text);outline-offset:3px }
            select option { background:#111;color:#f0f0ee }
            input[type="range"] { -webkit-appearance:none;width:96px;height:1px;background:var(--border);outline:none;cursor:pointer;flex-shrink:0 }
            input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none;width:7px;height:7px;background:var(--text);border-radius:50%;cursor:pointer;opacity:0.55;transition:opacity 0.12s,transform 0.12s }
            input[type="range"]:hover::-webkit-slider-thumb { opacity:1;transform:scale(1.35) }
            /* ── Toggle switch ── */
            .switch { position:relative;display:inline-flex;align-items:center;width:30px;height:17px;cursor:pointer;flex-shrink:0 }
            .switch input { opacity:0;width:0;height:0;position:absolute }
            .switch-track { position:absolute;inset:0;background:var(--accent);border-radius:9px;transition:background 0.18s }
            .switch input:checked ~ .switch-track { background:var(--text);opacity:0.75 }
            .switch-thumb { position:absolute;top:3px;left:3px;width:11px;height:11px;background:var(--bg);border-radius:50%;transition:transform 0.18s,background 0.18s;pointer-events:none }
            .switch input:checked ~ .switch-track ~ .switch-thumb { transform:translateX(13px) }
            body.light-mode .switch-thumb { background:var(--text) }
            .switch:focus-within .switch-track { outline:1px solid var(--text);outline-offset:2px }
            .ghost-btn { background:none;border:1px solid var(--border);color:var(--text);font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:0.1em;padding:6px 10px;cursor:pointer;opacity:0.57;text-transform:uppercase;transition:opacity 0.15s;width:100% }
            .ghost-btn:hover { opacity:0.9 }
            .ghost-btn:focus-visible { opacity:1;outline:1px solid var(--text);outline-offset:2px }
            .gradient-stops { display:flex;flex-wrap:wrap;gap:5px }
            .stop-item { display:flex;align-items:center;gap:4px;padding:3px;border:1px solid var(--border);background:rgba(255,255,255,0.02) }
            .stop-item input[type="color"] { width:16px;height:16px;border:none;background:none;cursor:pointer;padding:0 }
            .remove-stop { cursor:pointer;opacity:0.57;font-size:11px;transition:opacity 0.12s }
            .remove-stop:hover { opacity:1 }
            .remove-stop:focus-visible { opacity:1;outline:1px solid var(--text);outline-offset:2px }
            /* ── Focus ── */
            input[type="range"]:focus-visible { outline:1px solid var(--text);outline-offset:4px;opacity:1 }
            .import-btn:focus-visible { opacity:1;outline:1px solid var(--text);outline-offset:2px }
            /* ── Light mode contrast ── */
            body.light-mode select { opacity:0.72 }
            body.light-mode select:hover { opacity:1 }
            body.light-mode .pin-btn { opacity:0.72 }
            body.light-mode .pin-btn:hover, body.light-mode .pin-btn.pinned { opacity:0.85 }
        </style>
    </head>
    <body>
        <div id="panel-trigger" role="button" tabindex="0" aria-label="Open controls panel" aria-expanded="false" aria-controls="panel"></div>
        <aside id="panel" aria-label="Controls panel" aria-hidden="true">
            <header class="panel-hd">
                <span class="panel-logo" aria-hidden="true">KR</span>
                <button id="pin-btn" class="pin-btn" aria-label="Pin controls panel open — keyboard shortcut: backslash" aria-pressed="false">○</button>
            </header>
            <div class="panel-body">
                <div class="panel-sec">
                    <label class="import-btn" for="file-input">Import Texture</label>
                    <input type="file" id="file-input" accept="image/*">
                </div>
                <div class="panel-sec">
                    <span class="sec-label">Render</span>
                    <div class="ctrl-row"><label class="ctrl-label" for="palette-select">Palette</label>
                        <select id="palette-select">
                            <option value="original">Original Cold</option><option value="monochrome">Pure Mono</option><option value="nord">Nordic Frost</option>
                            <optgroup label="Ghostty"><option value="ghostty">Tokyo Night</option><option value="ghosttyDracula">Dracula</option><option value="ghosttyCatppuccin">Catppuccin</option></optgroup>
                            <optgroup label="Zed"><option value="zed">Atmosphere</option><option value="zedRose">Rosé Pine</option><option value="zedAndromeda">Andromeda</option></optgroup>
                            <optgroup label="Cursor"><option value="cursorDark">Midnight</option><option value="cursorEmber">Ember</option></optgroup>
                        </select></div>
                </div>
                <div class="panel-sec">
                    <div class="ctrl-row"><span class="sec-label">Dither</span><label class="switch"><input type="checkbox" id="dither-toggle"><span class="switch-track"></span><span class="switch-thumb"></span></label></div>
                    <div id="dither-controls" style="display:none;flex-direction:column;gap:9px;">
                        <div class="ctrl-row"><label class="ctrl-label" for="dither-mode-select">Mode</label>
                            <select id="dither-mode-select">
                                <option value="blueNoise" selected>Blue Noise</option>
                                <option value="blueNoise2x">Blue Noise 2x</option>
                                <option value="blueNoise05x">Blue Noise 0.5x</option>
                                <option value="bayer4">Bayer 4x4</option>
                                <option value="bayer8">Bayer 8x8</option>
                                <option value="bayer16">Bayer 16x16</option>
                                <option value="random">Random</option>
                                <option value="ign">IGN</option>
                                <option value="halftone">Halftone</option>
                                <option value="crosshatch">Crosshatch</option>
                                <option value="checkerboard">Checkerboard</option>
                            </select></div>
                        <div class="ctrl-row"><label class="ctrl-label" for="dither-strength-control">Strength</label><input type="range" id="dither-strength-control" min="0" max="2.0" step="0.1" value="1.0"><span class="ctrl-val" id="dither-strength-val">1.0</span></div>
                    </div>
                </div>
                <div class="panel-sec">
                    <div class="ctrl-row"><span class="sec-label">Glyph Dither</span><label class="switch"><input type="checkbox" id="glyph-dither-toggle"><span class="switch-track"></span><span class="switch-thumb"></span></label></div>
                    <div id="glyph-dither-controls" style="display:none;flex-direction:column;gap:9px;">
                        <div class="ctrl-row"><label class="ctrl-label" for="dither-select">Set</label>
                            <select id="dither-select">
                                <option value="characters">Characters</option>
                                <option value="classic" selected>Classic</option>
                                <option value="unicode">Unicode</option>
                                <option value="redacted">Redacted</option>
                                <option value="squares">Squares</option>
                                <option value="circles">Circles</option>
                                <option value="crt">CRT</option>
                                <option value="organic">Organic</option>
                                <option value="stars">Stars</option>
                                <option value="verticalLines">Vertical Lines</option>
                                <option value="horizontalLines">Horizontal Lines</option>
                                <option value="verticalJitter">Vertical Jitter</option>
                                <option value="horizontalJitter">Horizontal Jitter</option>
                                <option value="waffle">Waffle</option>
                                <option value="porthole">Porthole</option>
                                <option value="zigzag">Zigzag</option>
                                <option value="eyes">Eyes</option>
                                <option value="blueNoiseish">Blue Noiseish</option>
                                <option value="diagonals">Diagonals</option>
                            </select></div>
                    </div>
                </div>
                <div class="panel-sec">
                    <div class="ctrl-row"><span class="sec-label">Gradient Map</span><label class="switch"><input type="checkbox" id="gradient-toggle"><span class="switch-track"></span><span class="switch-thumb"></span></label></div>
                    <div id="gradient-controls" style="display:none;flex-direction:column;gap:9px;">
                        <div class="gradient-stops" id="gradient-stops-list"></div>
                        <button class="ghost-btn" id="add-stop-btn">+ Add Stop</button>
                        <div class="ctrl-row"><label class="ctrl-label" for="gradient-phase-control">Phase</label><input type="range" id="gradient-phase-control" min="0" max="1" step="0.05" value="0"><span class="ctrl-val" id="gradient-phase-val">0</span></div>
                    </div>
                </div>
                <div class="panel-sec">
                    <span class="sec-label">Motion</span>
                    <div class="ctrl-row"><label class="ctrl-label" for="sprite-preset">Sprite</label>
                        <select id="sprite-preset"><option value="none" selected>None</option><option value="scan">Cine Sweep</option><option value="pulse">Radial Aura</option><option value="wave">Organic Wave</option></select></div>
                    <div class="ctrl-row" id="wave-type-row" style="display:none"><label class="ctrl-label" for="wave-type-select">Flow</label>
                        <select id="wave-type-select"><option value="fluid">Fluid</option><option value="chaos">Chaos</option><option value="ripples">Ripples</option></select></div>
                </div>
                <div class="panel-sec">
                    <span class="sec-label">Field</span>
                    <div class="ctrl-row"><label class="ctrl-label" for="bg-intensity-control">Intensity</label><input type="range" id="bg-intensity-control" min="0" max="5" step="0.1" value="1.0"><span class="ctrl-val" id="bg-intensity-val">1.0</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="gamma-control">Gamma</label><input type="range" id="gamma-control" min="0.1" max="5" step="0.1" value="1.2"><span class="ctrl-val" id="gamma-val">1.2</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="grid-size-control">Grid</label><input type="range" id="grid-size-control" min="2" max="20" step="1" value="4"><span class="ctrl-val" id="grid-size-val">4</span></div>
                </div>
                <div class="panel-sec">
                    <span class="sec-label">Cursor Shape</span>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-ellipse-x-control">Ellipse X</label><input type="range" id="cursor-ellipse-x-control" min="0.2" max="3.0" step="0.1" value="1.0"><span class="ctrl-val" id="cursor-ellipse-x-val">1.0</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-ellipse-y-control">Ellipse Y</label><input type="range" id="cursor-ellipse-y-control" min="0.2" max="3.0" step="0.1" value="1.0"><span class="ctrl-val" id="cursor-ellipse-y-val">1.0</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-rotation-control">Rotation</label><input type="range" id="cursor-rotation-control" min="0" max="360" step="1" value="0"><span class="ctrl-val" id="cursor-rotation-val">0</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-cone-angle-control">Cone</label><input type="range" id="cursor-cone-angle-control" min="10" max="360" step="5" value="360"><span class="ctrl-val" id="cursor-cone-angle-val">360</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-dead-zone-control">Dead Zone</label><input type="range" id="cursor-dead-zone-control" min="0" max="0.8" step="0.05" value="0"><span class="ctrl-val" id="cursor-dead-zone-val">0</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-activation-curve-select">Activation</label>
                        <select id="cursor-activation-curve-select"><option value="linear" selected>Linear</option><option value="quadratic">Quadratic</option><option value="cubic">Cubic</option><option value="step2">Step 2</option><option value="step3">Step 3</option></select></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-line-phase-control">Line Phase</label><input type="range" id="cursor-line-phase-control" min="0" max="1.0" step="0.05" value="0"><span class="ctrl-val" id="cursor-line-phase-val">0</span></div>
                </div>
                <div class="panel-sec">
                    <div class="ctrl-row"><span class="sec-label">Pin Cursor</span><label class="switch"><input type="checkbox" id="cursor-pin-toggle"><span class="switch-track"></span><span class="switch-thumb"></span></label></div>
                    <div id="cursor-pin-controls" style="display:none;flex-direction:column;gap:9px;">
                        <div class="ctrl-row"><label class="ctrl-label" for="cursor-pin-x-control">X</label><input type="range" id="cursor-pin-x-control" min="0" max="800" step="1" value="0"><span class="ctrl-val" id="cursor-pin-x-val">0</span></div>
                        <div class="ctrl-row"><label class="ctrl-label" for="cursor-pin-y-control">Y</label><input type="range" id="cursor-pin-y-control" min="0" max="600" step="1" value="0"><span class="ctrl-val" id="cursor-pin-y-val">0</span></div>
                    </div>
                </div>
                <div class="panel-sec">
                    <span class="sec-label">Cursor</span>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-mode-select">Mode</label>
                        <select id="cursor-mode-select"><option value="default" selected>Default</option><option value="attract">Attract</option><option value="repel">Repel</option><option value="orbit">Orbit</option><option value="drift">Drift</option><option value="spiral">Spiral</option><option value="gravity">Gravity</option><option value="shockwave">Shockwave</option></select></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-influence-control">Influence</label><input type="range" id="cursor-influence-control" min="0" max="1.0" step="0.1" value="1.0"><span class="ctrl-val" id="cursor-influence-val">1.0</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="mouse-radius-control">Radius</label><input type="range" id="mouse-radius-control" min="40" max="1000" step="10" value="200"><span class="ctrl-val" id="mouse-radius-val">200</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-softness-control">Softness</label><input type="range" id="cursor-softness-control" min="0.5" max="5.0" step="0.5" value="2.0"><span class="ctrl-val" id="cursor-softness-val">2.0</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="interaction-scale-control">Scale</label><input type="range" id="interaction-scale-control" min="0.5" max="8.0" step="0.5" value="3.0"><span class="ctrl-val" id="interaction-scale-val">3.0</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="spread-control">Spread</label><input type="range" id="spread-control" min="0" max="2.0" step="0.1" value="0.4"><span class="ctrl-val" id="spread-val">0.4</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="uuid-count-control">UUIDs</label><input type="range" id="uuid-count-control" min="1" max="16" step="1" value="4"><span class="ctrl-val" id="uuid-count-val">4</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="seed-control">Seed</label><input type="range" id="seed-control" min="0" max="999" step="1" value="0"><span class="ctrl-val" id="seed-val">0</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-lines-control">Lines</label><input type="range" id="cursor-lines-control" min="1" max="20" step="1" value="10"><span class="ctrl-val" id="cursor-lines-val">10</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="anim-speed-control">Speed</label><input type="range" id="anim-speed-control" min="0.2" max="3.0" step="0.2" value="1.0"><span class="ctrl-val" id="anim-speed-val">1.0</span></div>
                    <div class="ctrl-row" id="spiral-tightness-row" style="display:none"><label class="ctrl-label" for="cursor-spiral-tightness-control">Spiral</label><input type="range" id="cursor-spiral-tightness-control" min="0.1" max="6.0" step="0.1" value="2.0"><span class="ctrl-val" id="cursor-spiral-tightness-val">2.0</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-trail-decay-select">Trail</label>
                        <select id="cursor-trail-decay-select"><option value="linear" selected>Linear</option><option value="exponential">Exponential</option><option value="step">Step</option><option value="sine">Sine</option></select></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-echo-count-control">Echoes</label><input type="range" id="cursor-echo-count-control" min="0" max="4" step="1" value="0"><span class="ctrl-val" id="cursor-echo-count-val">0</span></div>
                    <div class="ctrl-row" id="echo-decay-row" style="display:none"><label class="ctrl-label" for="cursor-echo-decay-control">Echo Decay</label><input type="range" id="cursor-echo-decay-control" min="0.1" max="0.9" step="0.1" value="0.6"><span class="ctrl-val" id="cursor-echo-decay-val">0.6</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-idle-bloom-control">Idle Bloom</label><input type="range" id="cursor-idle-bloom-control" min="0" max="1.0" step="0.05" value="0"><span class="ctrl-val" id="cursor-idle-bloom-val">0</span></div>
                </div>
                <div class="panel-sec">
                    <span class="sec-label">Cursor Field</span>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-noise-warp-control">Noise Warp</label><input type="range" id="cursor-noise-warp-control" min="0" max="1.0" step="0.05" value="0"><span class="ctrl-val" id="cursor-noise-warp-val">0</span></div>
                    <div class="ctrl-row"><label class="ctrl-label" for="cursor-vortex-strength-control">Vortex</label><input type="range" id="cursor-vortex-strength-control" min="-2.0" max="2.0" step="0.1" value="0"><span class="ctrl-val" id="cursor-vortex-strength-val">0</span></div>
                </div>
                <div class="panel-sec">
                    <div class="ctrl-row"><span class="ctrl-label">Light Mode</span><label class="switch"><input type="checkbox" id="light-mode-toggle"><span class="switch-track"></span><span class="switch-thumb"></span></label></div>
                </div>
                <div class="panel-sec">
                    <button class="import-btn" id="export-png-btn">Export PNG</button>
                    <button class="import-btn" id="export-code-btn">Export Code</button>
                </div>
            </div>
        </aside>
        <canvas id="main-canvas"></canvas>

        <!-- ── Constants & Configuration ───────────────────────────────────────── -->
        <script>
            const PALETTES = {
                original:         { bg:"#080808", base:"#141412", sprite:"#7a7a76", cursor:"#f0f0ee", stops:["#080808","#7a7a76","#f0f0ee"] },
                monochrome:       { bg:"#000000", base:"#1a1a1a", sprite:"#444444", cursor:"#ffffff", stops:["#000000","#444444","#ffffff"] },
                nord:             { bg:"#2e3440", base:"#3b4252", sprite:"#88c0d0", cursor:"#eceff4", stops:["#2e3440","#88c0d0","#eceff4"] },
                ghostty:          { bg:"#1a1b26", base:"#24283b", sprite:"#bb9af7", cursor:"#c0caf5", stops:["#1a1b26","#bb9af7","#c0caf5"] },
                ghosttyDracula:   { bg:"#282a36", base:"#44475a", sprite:"#bd93f9", cursor:"#f8f8f2", stops:["#282a36","#bd93f9","#f8f8f2"] },
                ghosttyCatppuccin:{ bg:"#1e1e2e", base:"#313244", sprite:"#cba6f7", cursor:"#cdd6f4", stops:["#1e1e2e","#cba6f7","#cdd6f4"] },
                zed:              { bg:"#18181b", base:"#27272a", sprite:"#3b82f6", cursor:"#e2e8f0", stops:["#18181b","#3b82f6","#e2e8f0"] },
                zedRose:          { bg:"#191724", base:"#26233a", sprite:"#c4a7e7", cursor:"#e0def4", stops:["#191724","#c4a7e7","#e0def4"] },

                    let rawCurve;
                    switch (config.cursorActivationCurve) {
                        case 'quadratic': rawCurve = (1 - norm) * (1 - norm); break;
                        case 'cubic':     rawCurve = (1 - norm) ** 3; break;
                        case 'step2':     rawCurve = norm < 0.5 ? 1 : 0; break;
                        case 'step3':     rawCurve = norm < 0.33 ? 1 : norm < 0.66 ? 0.5 : 0; break;
                        default:          rawCurve = 1 - norm; // linear
                    }
                    this.triggerStrength = Math.pow(rawCurve, 1.0 / config.cursorSoftness);
                    this.delay = norm * 150;
                    this.lastVisited = now;
                }

                update(now) {
                    const tn = t(now); // scaled animation time
                    this.dx = this.x + this.cw * 0.5 - frame.cx;
                    this.dy = this.y + this.ch * 0.5 - frame.cy;

                    // ── Effective distance (accounts for ellipse + rotation + noise warp) ──
                    let edx = this.dx, edy = this.dy;
                    if (config.cursorNoiseWarp > 0) {
                        const nw = config.cursorNoiseWarp * config.influenceRadius * 0.3;
                        edx += Math.sin(this.x * 0.006 + frame.tn * 0.0009) * Math.cos(this.y * 0.004) * nw;
                        edy += Math.cos(this.x * 0.005 + frame.tn * 0.0007) * Math.sin(this.y * 0.006) * nw;
                    }
                    if (config.cursorRotation !== 0) {
                        const ra = -config.cursorRotation * Math.PI / 180;
                        const cosR = Math.cos(ra), sinR = Math.sin(ra);
                        const rdx = edx * cosR - edy * sinR;
                        const rdy = edx * sinR + edy * cosR;
                        edx = rdx; edy = rdy;
                    }
                    const dist = Math.sqrt((edx / config.cursorEllipseX) ** 2 + (edy / config.cursorEllipseY) ** 2)
                               * Math.sqrt(config.cursorEllipseX * config.cursorEllipseY);

                    const effRadius = bloomRadius || (config.influenceRadius * config.cursorInfluence);
                    if (dist < effRadius) this.trigger(tn, dist);

                    const elapsed = tn - this.startTime - this.delay;

                    if (this.state === "waking" && elapsed >= 0) {
                        this.displayChar =
                            WAKE_SET[
                                Math.floor(rng() * WAKE_SET.length)
                            ];
                        this.currentScale =
                            1.0 +
                            (config.interactionCharScale - 1.0) *
                                this.triggerStrength *
                                (elapsed / 200);
                        this.color = lerpColor(
                            this.getIdleColor(),
                            this.getActiveSpriteColor(),
                            Math.min(1, elapsed / 200) * this.triggerStrength,
                        );
                        if (elapsed >= 200) this.state = "encoding";
                    } else if (this.state === "encoding") {
                        if (tn - this.mutationTimer > 40) {
                            this.displayChar =
                                HEX_SET[
                                    Math.floor(rng() * HEX_SET.length)
                                ];
                            this.mutationTimer = tn;
                        }
                        this.currentScale = 1.0 + (config.interactionCharScale - 1.0) * this.triggerStrength;
                        this.color = lerpColor(this.getIdleColor(), this.getActiveSpriteColor(), this.triggerStrength);
                        if (elapsed >= 600) {
                            this.state = "crystallizing";
                            crystallizeUUID(this, tn);
                        }
                    } else if (this.state === "resolved") {
                        this.displayChar = this.uuidChar;
                        this.color = lerpColor(this.getIdleColor(), this.getActiveCursorColor(), this.triggerStrength);
                        this.currentScale = 1.0 + (config.interactionCharScale - 1.0) * this.triggerStrength;
                        if (tn - this.startTime > 800) {
                            this.state = "fading";
                            this.startTime = tn;
                        }
                    } else if (this.state === "fading") {
                        const fadeProg = (tn - this.startTime) / 400;
                        this.color = lerpColor(
                            lerpColor(this.getIdleColor(), this.getActiveCursorColor(), this.triggerStrength),
                            this.getIdleColor(),
                            Math.min(1, fadeProg),
                        );
                        this.currentScale =
                            1.0 +
                            (config.interactionCharScale - 1.0) *
                                this.triggerStrength *
                                (1.0 - Math.min(1, fadeProg));
                        if (fadeProg >= 1) {
                            this.state = "idle";
                            this.displayChar = this.baseChar;
                            this.currentScale = 1.0;
                        }
                    }

                    if (this.state === "idle") {
                        const timeSinceVisit = tn - this.lastVisited;
                        const sVal = getSpriteInfluence(this.x, this.y, now);

                        if (timeSinceVisit < 600) {
                            let trailProgress;
                            const raw = timeSinceVisit / 600;
                            switch (config.cursorTrailDecay) {
                                case 'exponential': trailProgress = easeOutExpo(raw); break;
                                case 'step':        trailProgress = raw < 0.5 ? 0 : 1; break;
                                case 'sine':        trailProgress = 0.5 - 0.5 * Math.cos(Math.PI * raw); break;
                                default:            trailProgress = raw; // linear
                            }
                            this.color = lerpColor(
                                this.getActiveCursorColor(),
                                this.getIdleColor(),
                                trailProgress,
                            );
                            this.displayChar = this.baseChar;
                        } else if (sVal > 0.01) {
                            const s = smoothStep(0, 1, sVal);
                            this.color = lerpColor(
                                this.getIdleColor(),
                                this.getActiveSpriteColor(),
                                s,
                            );
                            const intensity = this.getFinalIntensity(s);
                            this.displayChar = quantizeChar(intensity, this.col, this.row);
                        } else {
                            this.color = this.getIdleColor();
                            this.displayChar = this.baseChar;
                        }
                    }
                }

                getFinalIntensity(additive = 0) {
                    const l =
                        Math.pow(
                            this.baseDensity,
                            1 / Math.max(0.1, config.gamma),
                        ) * config.bgIntensity;
                    return Math.max(0, Math.min(0.99, l + additive));
                }

                getIdleColor() {
                    const luminance = this.getFinalIntensity(0);
                    if (config.gradientMap && config.gradientStops.length > 1) {
                        const stops = config.gradientStops;
                        const phased =
                            (luminance + config.gradientPhase) % 1.00001;
                        const i = Math.floor(phased * (stops.length - 1));
                        const frac = (phased * (stops.length - 1)) % 1;
                        return lerpColor(
                            stops[i],
                            stops[Math.min(i + 1, stops.length - 1)],
                            frac,
                        );
                    }
                    const cBG = config.lightMode
                        ? currentPalette.cursor
                        : currentPalette.bg;
                    const cACC = config.lightMode
                        ? currentPalette.bg
                        : currentPalette.cursor;
                    return lerpColor(cBG, cACC, luminance * 0.4);
                }

                getActiveSpriteColor() {
                    if (config.gradientMap)
                        return (
                            config.gradientStops[
                                Math.floor(config.gradientStops.length * 0.5)
                            ] || currentPalette.sprite
                        );
                    return config.lightMode
                        ? lerpColor(currentPalette.sprite, "#000000", 0.2)
                        : currentPalette.sprite;
                }

                getActiveCursorColor() {
                    if (config.gradientMap)
                        return (
                            config.gradientStops[
                                config.gradientStops.length - 1
                            ] || currentPalette.cursor
                        );
                    return config.lightMode
                        ? currentPalette.bg
                        : currentPalette.cursor;
                }

                draw(pass) {
                    if (this.displayChar === ' ') return;
                    const isInteraction = this.state !== "idle";
                    if (pass === "base" && isInteraction) return;
                    if (pass === "interaction" && !isInteraction) return;
                    const baseFS = Math.floor(this.ch * 0.9);
                    const cd = fullDisplacement(this.dx, this.dy, this.x, this.y);
                    let sx = cd[0], sy = cd[1];
                    if (isInteraction) {
                        sx += this.dx * (this.currentScale - 1.0) * config.spreadFactor;
                        sy += this.dy * (this.currentScale - 1.0) * config.spreadFactor;
                    }
                    ctx.save();
                    ctx.fillStyle = this.color;
                    ctx.translate(this.x + this.cw / 2 + sx, this.y + this.ch / 2 + sy);
                    ctx.font = `${this.currentScale > 2.5 ? "400" : "300"} ${Math.floor(baseFS * this.currentScale)}px "Geist Mono"`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(this.displayChar, 0, 0);
                    ctx.restore();
                }
            }

            // ── Grid management ──────────────────────────────────────────────────

            function adaptViewport() {
                const margin = 0.92;
                const winW = window.innerWidth * margin;
                const winH = window.innerHeight * margin;
                const winAspect = winW / winH;
                let finalW, finalH;
                if (imageAspectRatio > winAspect) {
                    finalW = winW;
                    finalH = finalW / imageAspectRatio;
                } else {
                    finalH = winH;
                    finalW = finalH * imageAspectRatio;
                }
                canvas.width = Math.floor(finalW);
                canvas.height = Math.floor(finalH);
                canvas.style.width = `${canvas.width}px`;
                canvas.style.height = `${canvas.height}px`;
            }

            function initGrid() {
                adaptViewport();
                const cw = config.cellSize;
                const ch = Math.round(cw * config.cellHeightRatio);
                cols = Math.ceil(canvas.width / cw);
                rows = Math.ceil(canvas.height / ch);
                grid = [];
                for (let r = 0; r < rows; r++)
                    for (let c = 0; c < cols; c++)
                        grid.push(new Cell(c, r, cw, ch));
                generateDensity();
                initStaticBase();
                const pinX = document.getElementById('cursor-pin-x-control');
                const pinY = document.getElementById('cursor-pin-y-control');
                if (pinX) { pinX.max = canvas.width; }
                if (pinY) { pinY.max = canvas.height; }
            }

            function generateDensity() {
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        let v;
                        if (imageBuffer) {
                            const ix = Math.floor(
                                (c / cols) * imageBuffer.width,
                            );
                            const iy = Math.floor(
                                (r / rows) * imageBuffer.height,
                            );
                            const p =
                                (Math.min(iy, imageBuffer.height - 1) *
                                    imageBuffer.width +
                                    Math.min(ix, imageBuffer.width - 1)) *
                                4;
                            v =
                                (imageBuffer.data[p] +
                                    imageBuffer.data[p + 1] +
                                    imageBuffer.data[p + 2]) /
                                765;
                        } else {
                            v =
                                (Math.sin(c * 0.045) * Math.cos(r * 0.085) +
                                    Math.sin(c * 0.1) * 0.5) /
                                1.5;
                            v = (v + 1) / 2;
                        }
                        const cell = grid[r * cols + c];
                        cell.baseDensity = v;
                        cell.baseChar = quantizeChar(cell.getFinalIntensity(0), c, r);
                        cell.displayChar = cell.baseChar;
                    }
                }
                staticBaseDirty = true;
            }

            // ── Render loop (phased pipeline) ───────────────────────────────────
            //
            //  Phase 1  Update with spatial culling — skip idle cells outside
            //           cursor radius, sprite zone, and recently-visited window.
            //  Phase 2  Composite the cached static base via drawImage.
            //  Phase 3  Overdraw dynamic idle cells (sprite/cursor influenced)
            //           with a single font setting — no save/restore.
            //  Phase 4  Draw interaction cells (font-batched where possible).

            function loop(now) {
                // ── Frame state cache ──
                const box = canvas.getBoundingClientRect();
                frame.mx = mouse.x - box.left;
                frame.my = mouse.y - box.top;
                frame.cx = config.cursorPinned ? config.cursorPinX : frame.mx;
                frame.cy = config.cursorPinned ? config.cursorPinY : frame.my;
                if (config.cursorPinned) {
                    const adx = frame.mx - config.cursorPinX;
                    const ady = frame.my - config.cursorPinY;
                    config.cursorRotation = Math.atan2(ady, adx) * 180 / Math.PI;
                }

                // ── Smooth animation speed transitions ──
                if (frame.lastAnimSpeed !== config.animationSpeed) {
                    const diff = config.animationSpeed - frame.lastAnimSpeed;
                    const step = diff * 0.06;
                    const next = (Math.abs(diff) < 0.005)
                        ? config.animationSpeed
                        : frame.lastAnimSpeed + step;
                    const delta = now * (next - frame.lastAnimSpeed);
                    for (let i = 0; i < grid.length; i++) {
                        const c = grid[i];
                        c.startTime    += delta;
                        c.mutationTimer += delta;
                        c.lastVisited  += delta;
                    }
                    for (let i = 0; i < activeUUIDGroups.length; i++) {
                        activeUUIDGroups[i].startTime += delta;
                    }
                    frame.lastAnimSpeed = next;
                }

                frame.tn = t(now);

                // ── Velocity direction tracker (exponentially smoothed) ──
                const vdx = frame.mx - prevMouse.x, vdy = frame.my - prevMouse.y;
                const vlen = Math.sqrt(vdx * vdx + vdy * vdy);
                if (vlen > 1) {
                    velocityDir.x += (vdx / vlen - velocityDir.x) * 0.2;
                    velocityDir.y += (vdy / vlen - velocityDir.y) * 0.2;
                    const vn = Math.sqrt(velocityDir.x ** 2 + velocityDir.y ** 2);
                    if (vn > 0.001) { velocityDir.x /= vn; velocityDir.y /= vn; }
                    lastMoveTime = frame.tn;
                    idleStart = 0;
                }
                prevMouse.x = frame.mx; prevMouse.y = frame.my;

                // ── Idle bloom ──
                if (config.cursorIdleBloom > 0) {
                    if (vlen <= 1) {
                        if (idleStart === 0) idleStart = frame.tn;
                        const idleDur = frame.tn - idleStart;
                        if (idleDur > 800) {
                            const progress = Math.min(1, (idleDur - 800) / 2000);
                            bloomRadius = config.influenceRadius * config.cursorInfluence *
                                (1 + config.cursorIdleBloom * 0.5 * progress);
                        } else {
                            bloomRadius = config.influenceRadius * config.cursorInfluence;
                        }
                    } else {
                        idleStart = 0;
                        bloomRadius = config.influenceRadius * config.cursorInfluence;
                    }
                } else {
                    bloomRadius = 0; // 0 = use default effR everywhere
                }

                // ── Echo buffer (update every 80ms) ──
                if (config.cursorEchoCount > 0) {
                    if (frame.tn - echoTimer > 80) {
                        echoPositions.unshift({ x: frame.cx, y: frame.cy });
                        while (echoPositions.length > config.cursorEchoCount)
                            echoPositions.pop();
                        echoTimer = frame.tn;
                    }
                } else {
                    echoPositions.length = 0;
                }

                // ── Shockwave expiry ──
                if (config.shockwaveActive) {
                    const waveDist = frame.tn - shockwaveTime;
                    const eR = bloomRadius || (config.influenceRadius * config.cursorInfluence);
                    if (waveDist * 0.4 > eR * 2) config.shockwaveActive = false;
                }

                const spriteZone = computeSpriteZone(now);
                const effR = bloomRadius || (config.influenceRadius * config.cursorInfluence);
                // Expand culling radius for ellipse stretch + noise warp margin
                const cullR = effR * Math.max(config.cursorEllipseX, config.cursorEllipseY, 1)
                            + config.cursorNoiseWarp * config.influenceRadius * 0.3;
                const rSq = cullR * cullR;

                // ── Phase 1: Update with spatial culling ──
                _iCount = 0; _dCount = 0;
                for (let i = 0; i < grid.length; i++) {
                    const cell = grid[i];
                    if (cell.state === 'idle') {
                        const dx = cell.x + cell.cw * 0.5 - frame.cx;
                        const dy = cell.y + cell.ch * 0.5 - frame.cy;
                        if (dx * dx + dy * dy >= rSq
                            && !cellInZone(cell, spriteZone)
                            && frame.tn - cell.lastVisited >= 600) continue;
                        cell.update(now);
                        _dBuf[_dCount++] = cell;
                    } else {
                        cell.update(now);
                        if (cell.state !== 'idle') _iBuf[_iCount++] = cell;
                        else _dBuf[_dCount++] = cell; // just transitioned to idle
                    }
                }

                // ── Phase 2: Composite static base ──
                if (staticBaseDirty) rebuildStaticBase();
                ctx.drawImage(staticBase, 0, 0);

                // ── Phase 3: Overdraw dynamic idle cells ──
                const bg = config.lightMode ? currentPalette.cursor : currentPalette.bg;
                const baseFontSize = Math.floor(Math.round(config.cellSize * config.cellHeightRatio) * 0.9);
                ctx.font = `300 ${baseFontSize}px "Geist Mono"`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (let i = 0; i < _dCount; i++) {
                    const cell = _dBuf[i];
                    ctx.fillStyle = bg;
                    ctx.fillRect(cell.x, cell.y, cell.cw, cell.ch);
                    if (cell.displayChar === ' ') continue;
                    const cd = fullDisplacement(cell.dx, cell.dy, cell.x, cell.y);
                    ctx.fillStyle = cell.color;
                    ctx.fillText(cell.displayChar, cell.x + cell.cw * 0.5 + cd[0], cell.y + cell.ch * 0.5 + cd[1]);
                }

                // ── Phase 4: Interaction cells ──
                for (let i = 0; i < _iCount; i++) {
                    _iBuf[i].draw("interaction");
                }

                requestAnimationFrame(loop);
            }
        </script>

        <!-- ── UI: event listeners & boot ───────────────────────────────────── -->
        <script>
            const fileInput  = document.getElementById('file-input');
            const panel      = document.getElementById('panel');
            const trigger    = document.getElementById('panel-trigger');
            const pinBtn     = document.getElementById('pin-btn');
            let panelPinned  = false;
            let hideTimer    = null;

            function openPanel() {
                clearTimeout(hideTimer);
                panel.style.transition = 'transform 0.18s cubic-bezier(0.16, 1, 0.3, 1)';
                panel.classList.add('open');
                panel.setAttribute('aria-hidden', 'false');
                trigger.setAttribute('aria-expanded', 'true');
                trigger.setAttribute('aria-label', 'Close controls panel');
            }
            function closePanel(immediate = false) {
                if (panelPinned) return;
                clearTimeout(hideTimer);
                hideTimer = setTimeout(() => {
                    panel.style.transition = 'transform 0.16s cubic-bezier(0.4, 0, 1, 1)';
                    panel.classList.remove('open');
                    panel.setAttribute('aria-hidden', 'true');
                    trigger.setAttribute('aria-expanded', 'false');
                    trigger.setAttribute('aria-label', 'Open controls panel');
                }, immediate ? 0 : 280);
            }

            trigger.addEventListener('mouseenter', openPanel);
            panel.addEventListener('mouseenter',  openPanel);
            panel.addEventListener('mouseleave',  () => closePanel());
            trigger.addEventListener('mouseleave', () => closePanel());

            // Keyboard activation on the trigger strip (Enter / Space)
            trigger.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (panel.classList.contains('open')) closePanel(true);
                    else openPanel();
                }
            });

            function setPinned(value) {
                panelPinned = value;
                pinBtn.textContent  = panelPinned ? '●' : '○';
                pinBtn.setAttribute('aria-pressed', String(panelPinned));
                pinBtn.classList.toggle('pinned', panelPinned);
                if (panelPinned) openPanel(); else closePanel(true);
            }

            pinBtn.addEventListener('click', () => setPinned(!panelPinned));

            document.addEventListener('keydown', e => {
                if (e.key === '\\' && !e.metaKey && !e.ctrlKey && !e.altKey) setPinned(!panelPinned);
            });

            function renderGradientStops() {
                const list = document.getElementById("gradient-stops-list");
                list.innerHTML = "";
                config.gradientStops.forEach((color, i) => {
                    const item = document.createElement("div");
                    item.className = "stop-item";
                    item.innerHTML = `<input type="color" aria-label="Gradient stop ${i + 1} color" value="${color}" data-index="${i}"><button class="remove-stop" aria-label="Remove stop ${i + 1}" data-index="${i}">×</button>`;
                    list.appendChild(item);
                });
                list.querySelectorAll('input[type="color"]').forEach(
                    (input) => {
                        input.addEventListener("input", (e) => {
                            config.gradientStops[e.target.dataset.index] =
                                e.target.value;
                            staticBaseDirty = true;
                        });
                    },
                );
                list.querySelectorAll(".remove-stop").forEach((btn) => {
                    btn.addEventListener("click", (e) => {
                        if (config.gradientStops.length > 2) {
                            config.gradientStops.splice(
                                e.target.dataset.index,
                                1,
                            );
                            renderGradientStops();
                        }
                    });
                });
            }

            // Global input events
            window.addEventListener("mousemove", (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            window.addEventListener("resize", initGrid);

            // File import
            fileInput.addEventListener("change", (e) => {
                const f = e.target.files[0];
                if (!f) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        imageAspectRatio = img.width / img.height;
                        const tmp = document.createElement("canvas");
                        tmp.width = img.width;
                        tmp.height = img.height;
                        tmp.getContext("2d").drawImage(img, 0, 0);
                        imageBuffer = tmp
                            .getContext("2d")
                            .getImageData(0, 0, img.width, img.height);
                        initGrid();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(f);
            });

            // Palette & dither
            document
                .getElementById("palette-select")
                .addEventListener("change", (e) => {
                    currentPalette = PALETTES[e.target.value];
                    config.gradientStops = [...currentPalette.stops];
                    staticBaseDirty = true;
                    renderGradientStops();
                });
            // Glyph Dither toggle + set
            document
                .getElementById("glyph-dither-toggle")
                .addEventListener("change", (e) => {
                    config.glyphDitherEnabled = e.target.checked;
                    document.getElementById("glyph-dither-controls").style.display =
                        config.glyphDitherEnabled ? "flex" : "none";
                    generateDensity();
                });
            document
                .getElementById("dither-select")
                .addEventListener("change", (e) => {
                    config.dither = e.target.value;
                    generateDensity();
                });

            // Dither toggle + mode + strength
            document
                .getElementById("dither-toggle")
                .addEventListener("change", (e) => {
                    config.ditherEnabled = e.target.checked;
                    document.getElementById("dither-controls").style.display =
                        config.ditherEnabled ? "flex" : "none";
                    generateDensity();
                });
            document
                .getElementById("dither-mode-select")
                .addEventListener("change", (e) => {
                    config.ditherMode = e.target.value;
                    generateDensity();
                });
            bindSlider("dither-strength-control", "dither-strength-val", "ditherStrength", parseFloat, { after: generateDensity });

            // Numeric controls — helper to bind slider → config + value readout
            function bindSlider(id, valId, prop, parse, opts) {
                const el = document.getElementById(id);
                const val = document.getElementById(valId);
                el.addEventListener("input", (e) => {
                    const v = parse(e.target.value);
                    config[prop] = v;
                    val.textContent = Number.isInteger(v) ? v : v.toFixed(1);
                    if (opts && opts.after) opts.after();
                });
            }
            bindSlider("bg-intensity-control", "bg-intensity-val", "bgIntensity", parseFloat, { after: generateDensity });
            bindSlider("gamma-control", "gamma-val", "gamma", parseFloat, { after: generateDensity });
            bindSlider("grid-size-control", "grid-size-val", "cellSize", parseFloat, { after: initGrid });
            bindSlider("cursor-influence-control", "cursor-influence-val", "cursorInfluence", parseFloat);
            bindSlider("mouse-radius-control", "mouse-radius-val", "influenceRadius", parseInt);
            bindSlider("cursor-softness-control", "cursor-softness-val", "cursorSoftness", parseFloat);
            bindSlider("interaction-scale-control", "interaction-scale-val", "interactionCharScale", parseFloat);
            bindSlider("spread-control", "spread-val", "spreadFactor", parseFloat);
            bindSlider("uuid-count-control", "uuid-count-val", "uuidCount", parseInt);
            bindSlider("cursor-lines-control", "cursor-lines-val", "cursorLines", parseInt);
            bindSlider("anim-speed-control", "anim-speed-val", "animationSpeed", parseFloat);
            document
                .getElementById("seed-control")
                .addEventListener("input", (e) => {
                    config.seed = parseInt(e.target.value);
                    document.getElementById("seed-val").textContent = config.seed;
                    applySeed();
                });
            document
                .getElementById("cursor-mode-select")
                .addEventListener("change", (e) => {
                    config.cursorMode = e.target.value;
                    document.getElementById("spiral-tightness-row").style.display =
                        config.cursorMode === "spiral" ? "flex" : "none";
                });

            // ── Cursor Shape controls ──
            bindSlider("cursor-ellipse-x-control", "cursor-ellipse-x-val", "cursorEllipseX", parseFloat);
            bindSlider("cursor-ellipse-y-control", "cursor-ellipse-y-val", "cursorEllipseY", parseFloat);
            bindSlider("cursor-rotation-control", "cursor-rotation-val", "cursorRotation", parseInt);
            bindSlider("cursor-cone-angle-control", "cursor-cone-angle-val", "cursorConeAngle", parseInt);
            bindSlider("cursor-dead-zone-control", "cursor-dead-zone-val", "cursorDeadZone", parseFloat);
            bindSlider("cursor-line-phase-control", "cursor-line-phase-val", "cursorLinePhase", parseFloat);
            document
                .getElementById("cursor-activation-curve-select")
                .addEventListener("change", (e) => { config.cursorActivationCurve = e.target.value; });

            // ── Cursor extended controls ──
            bindSlider("cursor-spiral-tightness-control", "cursor-spiral-tightness-val", "cursorSpiralTightness", parseFloat);
            document
                .getElementById("cursor-trail-decay-select")
                .addEventListener("change", (e) => { config.cursorTrailDecay = e.target.value; });
            bindSlider("cursor-echo-count-control", "cursor-echo-count-val", "cursorEchoCount", parseInt, {
                after: () => {
                    document.getElementById("echo-decay-row").style.display =
                        config.cursorEchoCount > 0 ? "flex" : "none";
                }
            });
            bindSlider("cursor-echo-decay-control", "cursor-echo-decay-val", "cursorEchoDecay", parseFloat);
            bindSlider("cursor-idle-bloom-control", "cursor-idle-bloom-val", "cursorIdleBloom", parseFloat);

            // ── Cursor Field controls ──
            bindSlider("cursor-noise-warp-control", "cursor-noise-warp-val", "cursorNoiseWarp", parseFloat);
            bindSlider("cursor-vortex-strength-control", "cursor-vortex-strength-val", "cursorVortexStrength", parseFloat);

            // ── Pin Cursor controls ──
            let _savedRotation = 0;
            document.getElementById('cursor-pin-toggle').addEventListener('change', (e) => {
                config.cursorPinned = e.target.checked;
                document.getElementById('cursor-pin-controls').style.display =
                    config.cursorPinned ? 'flex' : 'none';
                if (config.cursorPinned) {
                    _savedRotation = config.cursorRotation;
                    config.cursorPinX = canvas.width / 2;
                    config.cursorPinY = canvas.height / 2;
                    const xEl = document.getElementById('cursor-pin-x-control');
                    const yEl = document.getElementById('cursor-pin-y-control');
                    xEl.max = canvas.width; yEl.max = canvas.height;
                    xEl.value = Math.round(config.cursorPinX);
                    yEl.value = Math.round(config.cursorPinY);
                    document.getElementById('cursor-pin-x-val').textContent = Math.round(config.cursorPinX);
                    document.getElementById('cursor-pin-y-val').textContent = Math.round(config.cursorPinY);
                } else {
                    config.cursorRotation = _savedRotation;
                }
            });
            bindSlider('cursor-pin-x-control', 'cursor-pin-x-val', 'cursorPinX', parseInt);
            bindSlider('cursor-pin-y-control', 'cursor-pin-y-val', 'cursorPinY', parseInt);

            // ── Shockwave click listener ──
            canvas.addEventListener("mousedown", () => {
                const box = canvas.getBoundingClientRect();
                const cx = mouse.x - box.left;
                const cy = mouse.y - box.top;
                if (config.cursorPinned) {
                    config.cursorPinX = cx;
                    config.cursorPinY = cy;
                    document.getElementById('cursor-pin-x-control').value = Math.round(cx);
                    document.getElementById('cursor-pin-x-val').textContent = Math.round(cx);
                    document.getElementById('cursor-pin-y-control').value = Math.round(cy);
                    document.getElementById('cursor-pin-y-val').textContent = Math.round(cy);
                    return;
                }
                if (config.cursorMode === 'shockwave') {
                    shockwaveOrigin.x = cx;
                    shockwaveOrigin.y = cy;
                    shockwaveTime = frame.tn;
                    config.shockwaveActive = true;
                }
            });

            document
                .getElementById("gradient-phase-control")
                .addEventListener("input", (e) => {
                    config.gradientPhase = parseFloat(e.target.value);
                    document.getElementById("gradient-phase-val").textContent = config.gradientPhase.toFixed(1);
                    staticBaseDirty = true;
                });

            // Gradient toggle
            document
                .getElementById("gradient-toggle")
                .addEventListener("change", (e) => {
                    config.gradientMap = e.target.checked;
                    staticBaseDirty = true;
                    document.getElementById("gradient-controls").style.display =
                        config.gradientMap ? "flex" : "none";
                });
            document
                .getElementById("add-stop-btn")
                .addEventListener("click", () => {
                    config.gradientStops.push("#ffffff");
                    renderGradientStops();
                });

            // Sprite preset & wave type
            document
                .getElementById("sprite-preset")
                .addEventListener("change", (e) => {
                    config.sprite = e.target.value;
                    document.getElementById("wave-type-row").style.display =
                        config.sprite === "wave" ? "flex" : "none";
                });
            document
                .getElementById("wave-type-select")
                .addEventListener("change", (e) => {
                    config.spriteSubtype = e.target.value;
                });

            // Light mode
            document
                .getElementById("light-mode-toggle")
                .addEventListener("change", (e) => {
                    config.lightMode = e.target.checked;
                    staticBaseDirty = true;
                    document.body.classList.toggle(
                        "light-mode",
                        config.lightMode,
                    );
                });

            // ── Export helpers ────────────────────────────────────────────────
            function exportTimestamp() {
                const d = new Date();
                const pad = n => String(n).padStart(2, '0');
                return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
            }

            function downloadBlob(blob, filename) {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                a.click();
                URL.revokeObjectURL(a.href);
            }

            // Export PNG
            document.getElementById('export-png-btn').addEventListener('click', () => {
                panel.classList.remove('open');
                requestAnimationFrame(() => {
                    canvas.toBlob(blob => {
                        downloadBlob(blob, `kiteracer-${exportTimestamp()}.png`);
                        if (panelPinned) panel.classList.add('open');
                    }, 'image/png');
                });
            });

            // Export Code — self-contained player snapshot
            // Extracts the live engine script from the DOM instead of maintaining a copy.
            document.getElementById('export-code-btn').addEventListener('click', () => {
                let imageDataURL = 'null';
                if (imageBuffer) {
                    const tmp = document.createElement('canvas');
                    tmp.width = imageBuffer.width; tmp.height = imageBuffer.height;
                    tmp.getContext('2d').putImageData(imageBuffer, 0, 0);
                    imageDataURL = "'" + tmp.toDataURL('image/png') + "'";
                }
                let paletteKey = 'original';
                for (const [k, v] of Object.entries(PALETTES)) {
                    if (v === currentPalette) { paletteKey = k; break; }
                }
                const engineCode = document.getElementById('engine').textContent;
                const sc = '<' + '/script>';
                const html = '<!DOCTYPE html>\n<html lang="en"><head><meta charset="UTF-8">'
                    + '<meta name="viewport" content="width=device-width,initial-scale=1.0">'
                    + '<title>Kiteracer Player</title>'
                    + '<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">'
                    + '<style>body,html{margin:0;padding:0;width:100%;height:100%;background:'
                    + (config.lightMode ? '#f0f0ee' : currentPalette.bg)
                    + ";font-family:'Geist Mono',monospace;overflow:hidden;display:flex;align-items:center;justify-content:center}"
                    + 'canvas{display:block;box-shadow:0 40px 100px rgba(0,0,0,0.8);background:#000}</style></head>'
                    + '<body' + (config.lightMode ? ' class="light-mode"' : '') + '>'
                    + '<canvas id="main-canvas"></canvas>'
                    + '<script>const PALETTES=' + JSON.stringify(PALETTES) + ';'
                    + 'const DITHER_SETS=' + JSON.stringify(DITHER_SETS) + ';'
                    + 'const WAKE_SET=' + JSON.stringify(WAKE_SET) + ';'
                    + 'const HEX_SET=' + JSON.stringify(HEX_SET) + ';'
                    + 'let currentPalette=PALETTES[' + JSON.stringify(paletteKey) + '];'
                    + 'const config=' + JSON.stringify(config) + ';' + sc
                    + '<script>' + engineCode + sc
                    + '<script>'
                    + 'imageAspectRatio=' + JSON.stringify(imageAspectRatio) + ';'
                    + 'applySeed();'
                    + 'const embeddedImage=' + imageDataURL + ';'
                    + 'if(embeddedImage){const img=new Image();img.onload=()=>{const tmp=document.createElement("canvas");'
                    + 'tmp.width=img.width;tmp.height=img.height;tmp.getContext("2d").drawImage(img,0,0);'
                    + 'imageBuffer=tmp.getContext("2d").getImageData(0,0,img.width,img.height);'
                    + 'initGrid();requestAnimationFrame(loop)};img.src=embeddedImage}'
                    + 'else{initGrid();requestAnimationFrame(loop)}'
                    + 'addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});'
                    + 'addEventListener("resize",initGrid);' + sc
                    + '</body></html>';
                const blob = new Blob([html], { type: 'text/html' });
                downloadBlob(blob, `kiteracer-player-${exportTimestamp()}.html`);
            });

            // Boot
            renderGradientStops();
            initGrid();
            requestAnimationFrame(loop);
        </script>
    </body>
</html>
